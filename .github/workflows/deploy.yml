# Pushes the branch to Cloudflare.
#
# There is one branch and it is the default one, so a push here is the release.
# Everything that can fail without a Cloudflare account runs first — install,
# typecheck, tests, build — and the deploy step only happens if all of it passed
# and the run is on the real branch rather than a fork's pull request.
name: Deploy

on:
  push:
    branches: [claude/voca-brain-map-mvp-y8xotu]
  # So a broken build can be caught before it is pushed.
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight deploy pointless, and two deploys racing
  # each other decide the live version by whichever finishes last.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway Postgres, created for this run and destroyed with it.
    #
    # Without one the database-backed suites skipped themselves and the job went
    # green: two thirds of the tests — every authorisation boundary, every
    # consent check, every guarantee about not overwriting a public map — were
    # not running at all, and nothing said so. A skipped test is not a passing
    # test, and the only way to stop it reading like one is to give CI a
    # database.
    #
    # It is empty, local to the runner, and its password is in this file
    # because it protects nothing. The production secret is never used for
    # tests; `resetDatabase` refuses to truncate a database whose name does not
    # contain "test", which is a second lock on the same door.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vocamap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vocamap_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Every migration, against an empty database. This is also the check that
      # a new one applies at all: a file the journal does not list is skipped in
      # silence, and that is how a column once shipped without ever existing.
      - name: Prepare the test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vocamap_test
        run: pnpm db:migrate

      # With TEST_DATABASE_URL set, the database-backed suites run for real —
      # and the run is failed if any of them skipped anyway.
      #
      # A skipped suite reports success, so this checks the count rather than
      # trusting the exit code: if Postgres were unreachable, every DB-backed
      # file would quietly skip and the job would still go green, which is the
      # state this repository was already in.
      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/test.log
          if grep -qE '[0-9]+ skipped' /tmp/test.log; then
            echo "::error::Database-backed tests skipped. TEST_DATABASE_URL is not reaching Postgres."
            grep -E 'Tests|Test Files' /tmp/test.log || true
            exit 1
          fi

      - name: Build
        run: pnpm run cf:build

      # Before the deploy, not after. Every migration here adds something —
      # a nullable column, a new table — so the running code ignores it until
      # the new code arrives, and the new code never arrives first.
      #
      # This step exists because it was missing. `en_definition_ko` shipped
      # against a database that did not have it, and every screen that reads a
      # Brain Map answered with a server error until the column was added by
      # hand. Nothing in the pipeline had noticed, because nothing in the
      # pipeline was looking.
      #
      # Neon's pooled connection cannot hold the advisory lock a migration
      # takes, so this wants the direct one — the URL *without* `-pooler` in
      # the host. `DATABASE_URL_UNPOOLED` is preferred when both are set.
      #
      # Missing secret warns and moves on. It used to fail the job, and that
      # was the wrong call twice over: it was a guard nobody had asked for, and
      # it held six deploys of unrelated fixes hostage to a secret that had
      # never been set. A migration that is configured and then *fails* still
      # stops the deploy — that is a real signal. Not being configured is not.
      - name: Migrate database
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ] && [ -z "$DATABASE_URL" ]; then
            echo "::warning::No database secret is set, so migrations were not run."
            echo "::warning::Add DATABASE_URL (Neon's direct URL, the one without '-pooler')"
            echo "::warning::under Settings → Secrets and variables → Actions to have them run here."
            echo "::warning::Until then, apply new drizzle/*.sql by hand and check /api/health after deploying."
            exit 0
          fi
          pnpm db:migrate

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
