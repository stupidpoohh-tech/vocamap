# Pushes the branch to Cloudflare.
#
# There is one branch and it is the default one, so a push here is the release.
# Everything that can fail without a Cloudflare account runs first — install,
# typecheck, tests, build — and the deploy step only happens if all of it passed
# and the run is on the real branch rather than a fork's pull request.
name: Deploy

on:
  push:
    branches: [claude/voca-brain-map-mvp-y8xotu]
  # So a broken build can be caught before it is pushed.
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight deploy pointless, and two deploys racing
  # each other decide the live version by whichever finishes last.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 데이터베이스가 없다. 이 작업은 한때 Postgres 를 하나 띄웠는데, 시험의
    # 2/3 이 그것 없이는 스스로 건너뛰면서 초록색으로 보고되었기 때문이다.
    # 그 시험들은 권한 경계와 동의 검사에 대한 것이었고, 그 코드와 함께
    # 없어졌다 — 서버가 들고 있는 남의 기록이 없으니 가려낼 경계가 없다.
    #
    # 남은 시험은 모두 순수 함수에 대한 것이라 건너뛰는 것이 없다. 아래
    # Test 단계가 그것을 확인한다.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # 건너뛴 시험은 통과한 시험이 아니다. 종료 코드만 믿지 않고 세어 본다 —
      # 한때 이 저장소가 바로 그 상태였다.
      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/test.log
          if grep -qE '[0-9]+ skipped' /tmp/test.log; then
            echo "::error::시험이 건너뛰어졌습니다. 건너뛴 시험은 통과한 시험이 아닙니다."
            grep -E 'Tests|Test Files' /tmp/test.log || true
            exit 1
          fi

      - name: Build
        run: pnpm run cf:build

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
